<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>融资租赁智能推荐系统</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 20px 40px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; text-align: center; }
        form { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-weight: bold; margin-bottom: 8px; color: #555; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        input:focus, select:focus { border-color: #0056b3; outline: none; }
        .full-width { grid-column: 1 / -1; }
        button { grid-column: 1 / -1; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 4px; font-size: 18px; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #004494; }
        #results { margin-top: 30px; }
        #results h2 { text-align: center; color: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        .loading, .error { text-align: center; font-size: 18px; padding: 20px; color: #777; }
    </style>
</head>
<body>

    <div class="container">
        <h1>融资租赁智能推荐系统</h1>

        <form id="recommendation-form">
            <div class="form-group">
                <label for="province">省份 (Province)</label>
                <input list="province-list" id="province" name="province" required>
                <datalist id="province-list"></datalist>
            </div>

            <div class="form-group">
                <label for="industry">申万一级行业 (Industry)</label>
                <select id="industry" name="industry" required></select>
            </div>

            <div class="form-group">
                <label for="value">租赁财产价值 (万元)</label>
                <input type="number" id="value" name="value" placeholder="e.g., 5000" required>
            </div>

            <div class="form-group">
                <label for="term_bin">租赁期限分箱 (Term Bin)</label>
                <select id="term_bin" name="term_bin" required></select>
            </div>

            <button type="submit" class="full-width">获取推荐</button>
        </form>

        <div id="results">
            <!-- Recommendation results will be displayed here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const provinceList = document.getElementById('province-list');
            const industrySelect = document.getElementById('industry');
            const termBinSelect = document.getElementById('term_bin');

            // Fetch options for dropdowns
            fetch('/api/form-options')
                .then(response => response.json())
                .then(data => {
                    if (data.error) throw new Error(data.error);

                    data.provinces.forEach(prov => {
                        const option = document.createElement('option');
                        option.value = prov;
                        provinceList.appendChild(option);
                    });

                    data.industries.forEach(ind => {
                        const option = document.createElement('option');
                        option.value = ind;
                        option.textContent = ind;
                        industrySelect.appendChild(option);
                    });

                    data.term_bins.forEach(term => {
                        const option = document.createElement('option');
                        option.value = term;
                        option.textContent = term;
                        termBinSelect.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error('Error fetching form options:', error);
                    document.getElementById('results').innerHTML = `<p class="error">无法加载表单选项，请检查后端服务是否正常。</p>`;
                });

            const form = document.getElementById('recommendation-form');
            const resultsDiv = document.getElementById('results');

            form.addEventListener('submit', (event) => {
                event.preventDefault();
                resultsDiv.innerHTML = `<p class="loading">正在查询，请稍候...</p>`;

                const formData = new FormData(form);
                const data = Object.fromEntries(formData.entries());

                fetch('/api/recommend', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => { throw new Error(err.error || '请求失败') });
                    }
                    return response.json();
                })
                .then(recommendations => {
                    if (recommendations.length === 0) {
                        resultsDiv.innerHTML = '<h2>推荐结果</h2><p>未找到匹配的推荐。</p>';
                        return;
                    }

                    let tableHTML = '<h2>推荐结果</h2><table><thead><tr><th>排名</th><th>出租人</th><th>推荐分数</th></tr></thead><tbody>';
                    recommendations.forEach((rec, index) => {
                        tableHTML += `<tr><td>${index + 1}</td><td>${rec[0]}</td><td>${rec[1]}</td></tr>`;
                    });
                    tableHTML += '</tbody></table>';
                    resultsDiv.innerHTML = tableHTML;
                })
                .catch(error => {
                    console.error('Error getting recommendations:', error);
                    resultsDiv.innerHTML = `<p class="error">查询失败: ${error.message}</p>`;
                });
            });
        });
    </script>
</body>
</html>
